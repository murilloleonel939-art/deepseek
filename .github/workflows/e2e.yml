name: E2E (real DeepSeek API)

# End-to-end suite (`pnpm run test:e2e`). The DEEPSEEK_API_KEY_EXTERNAL secret is
# OPTIONAL: when it is configured it is mapped to the env var DEEPSEEK_API_KEY the
# tests read, and the run hits the external API at
# https://api.deepseek.com/anthropic (DEEPSEEK_BASE_URL is pinned explicitly so a
# stray repo-root .env can't redirect the run). When it is absent, the real-API
# files self-skip and the keyless files still run.
#
# No job-level `if:` gates the run, and the key step only reports which mode is
# active. A keyless run therefore reports the keyless results rather than a
# missing-secret failure; read the "Report API key mode" annotation to tell a
# keyless run apart from an API-backed one.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Keep only the newest validation in each workflow/ref, including master
# pushes, nightly runs, and manual dispatches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: >-
      ${{ vars.DSH_CI_FAILOVER_LINUX == 'blacksmith'
          && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    name: e2e
    # Keyless validation: the real-API key is optional here. Suites that need it
    # self-skip when DEEPSEEK_API_KEY is absent, so the job reports a green
    # keyless run instead of failing on a repository secret this repo does not
    # configure. Add DEEPSEEK_API_KEY_EXTERNAL to enable the API-backed legs.
    # Profile e2e files can each own several complete dsh subprocess trees, so
    # four file workers preserve process/PTY headroom. Tests retain 120s/test
    # and retry 2; 45m still bounds retry storms against a slow API.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # The key is optional: report which mode this run uses and continue either
      # way. Real-API files self-skip without it; keyless files always run.
      - name: Report API key mode
        env:
          # Repo secret DEEPSEEK_API_KEY_EXTERNAL holds the external-API key;
          # the tests read process.env.DEEPSEEK_API_KEY, so map it across here.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "::notice::DEEPSEEK_API_KEY_EXTERNAL is not configured; real-API e2e files will self-skip."
          else
            echo "::notice::DEEPSEEK_API_KEY_EXTERNAL is configured; real-API e2e files will run."
          fi
      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      - name: Prepare Office runtime
        run: pnpm run prepare:primary-runtime --target linux-x64 --output .cache/e2e-office

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      # DEEPSEEK_BASE_URL is pinned to the external API; the secret is scoped to
      # this step and the mode report only — never exposed to checkout/setup/install.
      - name: E2E tests (real DeepSeek API)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com/anthropic
          DSH_PRIMARY_RUNTIME: ${{ github.workspace }}/.cache/e2e-office/primary-runtime
          DSH_E2E_MAX_WORKERS: 4
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
