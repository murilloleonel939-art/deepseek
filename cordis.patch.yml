# Proveedores de modelos (llm-pi-ai).
#
# Para agregar un modelo basta con añadir dos líneas dentro de sus `models`:
#
#     - id: id-exacto-del-proveedor
#       name: Nombre que verás en el selector
#
# `input` admite SOLO text e image. Cualquier otra modalidad hace que el
# esquema rechace TODA la sección y el selector quede vacío. Si el modelo no
# acepta imágenes, basta con omitir la línea `input`.

- id: llm-pi-ai
  config:
    providers:
      openai:
        displayName: OpenAI
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: https://api.openai.com/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            input: [text, image]
          - id: gpt-4-turbo
            name: GPT-4 Turbo
            input: [text, image]
          - id: gpt-4o
            name: GPT-4o
            input: [text, image]

      anthropic:
        displayName: Claude
        apiKeyEnv: ANTHROPIC_API_KEY
        api: anthropic-messages
        baseURL: https://api.anthropic.com
        defaultContextWindow: 200000
        defaultMaxTokens: 8192
        models:
          - id: claude-sonnet-5-5
            name: Claude Sonnet 5.5
            input: [text, image]
          - id: claude-haiku-4-5-20251001
            name: Claude Haiku 4.5
            input: [text, image]
          - id: claude-opus-4-1
            name: Claude Opus 4.1
            input: [text, image]

      pateway-claude:
        displayName: Pateway (Claude)
        apiKeyEnv: PATEWAY_API_KEY
        api: anthropic-messages
        baseURL: https://api.pateway.ai
        defaultContextWindow: 200000
        defaultMaxTokens: 8192
        models:
          - id: claude-opus-5-5
            name: Claude Opus 5.5 (Pateway)
            input: [text, image]
          - id: claude-sonnet-5
            name: Claude Sonnet 5 (Pateway)
            input: [text, image]
          - id: claude-haiku-5-5
            name: claude-haiku-5-5 (Pateway)
            input: [text, image]
          - id: claude-haiku-4-5-20251001
            name: Claude Haiku 4.5 (Pateway)
            input: [text, image]

      pateway-openai:
        displayName: Pateway (OpenAI)
        apiKeyEnv: PATEWAY_API_KEY
        api: openai-completions
        baseURL: https://api.pateway.ai/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: gpt-6.1-sol
            name: gpt-6.1-sol (Pateway)
            input: [text, image]
          - id: gpt-6-luna
            name: GPT-6 Luna (Pateway)
            input: [text, image]
          - id: gpt-5.6-terra
            name: GPT-5.6 Terra (Pateway)
            input: [text, image]
          - id: gpt-5.6-luna
            name: gpt-5.6-luna (Pateway)
            input: [text, image]

      openrouter:
        displayName: OpenRouter (múltiples modelos)
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: nvidia/nemotron-3-ultra-550b-a55b:free
            name: Nemotron 3 Ultra (gratis)
            input: [text]
          - id: openrouter/free
            name: OpenRouter Free (automático)
            input: [text, image]
      
      pateway-deepseek:
        displayName: Pateway (DeepSeek)
        apiKeyEnv: PATEWAY_API_KEY
        api: openai-completions
        baseURL: https://api.pateway.ai/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek-V4.1-Flash (Pateway)
            input: [text]

# Modelo con el que arranca un agente nuevo. Debe coincidir con un par
# proveedor/modelo declarado arriba, o cámbialo al que prefieras.
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: pateway-claude
    model: claude-haiku-4-5-20251001
