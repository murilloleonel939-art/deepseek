- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      openai:
        displayName: OpenAI
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: https://api.openai.com/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: gpt-5.6-luna
            name: GPT-5.6 Luna
            input: [text, image]
          - id: gpt-4-turbo
            name: GPT-4 Turbo
            input: [text, image]
      anthropic:
        displayName: Claude
        apiKeyEnv: ANTHROPIC_API_KEY
        api: anthropic-messages
        baseURL: https://api.anthropic.com
        defaultContextWindow: 200000
        defaultMaxTokens: 8192
        models:
          - id: claude-sonnet-5-5
            name: Claude Sonnet 5.5
            input: [text, image]
          - id: claude-haiku-4-5-20251001
            name: Claude Haiku 4.5
            input: [text, image]
      google:
        displayName: Gemini
        apiKeyEnv: GEMINI_API_KEY
        api: openai-completions
        baseURL: https://generativelanguage.googleapis.com/v1beta/openai
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: gemini-3.8-flash
            name: Gemini 3.8 Flash
            input: [text, image]
          - id: gemini-3.5-flash-lite
            name: Gemini 3.5 Flash-Lite
            input: [text, image]
          - id: gemini-3.1-pro-preview
            name: Gemini 3.1 Pro (preview)
            input: [text, image]
      openrouter:
        displayName: OpenRouter
        apiKeyEnv: OPENROUTER_API_KEY
        api: openai-completions
        baseURL: https://openrouter.ai/api/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 8192
        models:
          - id: google/gemini-3.8-flash
            name: Gemini 3.8 Flash (OpenRouter)
            input: [text, image]
          - id: nvidia/nemotron-3-ultra-550b-a55b:free
            name: Nemotron 3 Ultra (gratis)
          - id: nvidia/nemotron-3-super-120b-a12b:free
            name: Nemotron 3 Super (gratis)
          - id: thinkingmachines/inkling:free
            name: Inkling (gratis)
            input: [text, image]
          - id: qwen/qwen3.8-27b:free
            name: Qwen 3.8 27B (gratis)
            input: [text, image]
          - id: google/gemma-4-31b-it:free
            name: Gemma 4 31B (gratis)
            input: [text, image]
          - id: poolside/laguna-s-2.1:free
            name: Laguna S 2.1 (gratis, codigo)
          - id: cohere/north-mini-code:free
            name: North Mini Code (gratis)
          - id: openrouter/free
            name: OpenRouter Free (automatico)
            input: [text, image]
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash (de pago)
            input: [text, image]
      groq:
        displayName: Groq (plan gratuito - contexto bajo)
        apiKeyEnv: GROQ_API_KEY
        api: openai-completions
        baseURL: https://api.groq.com/openai/v1
        defaultContextWindow: 2048
        defaultMaxTokens: 512
        models:
          - id: openai/gpt-oss-120b
            name: GPT-OSS 120B
            input: [text]
          - id: openai/gpt-oss-20b
            name: GPT-OSS 20B (más rápido)
            input: [text]
      mistral:
        displayName: Mistral (plan gratuito)
        apiKeyEnv: MISTRAL_API_KEY
        api: openai-completions
        baseURL: https://api.mistral.ai/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 4096
        models:
          - id: mistral-large-latest
            name: Mistral Large
            input: [text]
          - id: mistral-small-latest
            name: Mistral Small (rápido)
            input: [text]
          - id: codestral-latest
            name: Codestral (código)
            input: [text]
          - id: ministral-8b-latest
            name: Ministral 8B (ligero)
            input: [text]
      nvidia:
        displayName: NVIDIA NIM (gratis, lista actualizada)
        apiKeyEnv: NVIDIA_API_KEY
        api: openai-completions
        baseURL: https://integrate.api.nvidia.com/v1
        defaultContextWindow: 128000
        defaultMaxTokens: 4096
        models:
          - id: nvidia/nemotron-4-340b-instruct
            name: Nemotron 4 340B (potente)
            input: [text]
          - id: nvidia/nemotron-3-super-120b-a12b
            name: Nemotron 3 Super 120B
            input: [text]
          - id: nvidia/llama-3.1-nemotron-ultra-253b-v1
            name: Nemotron Ultra 253B (razonamiento)
            input: [text]
          - id: nvidia/llama-3.1-nemotron-70b-instruct
            name: Llama 3.1 Nemotron 70B
            input: [text]
          - id: nvidia/nemotron-3.5-lightning-30b-a3b
            name: Nemotron 3.5 Lightning 30B (rápido)
            input: [text]
          - id: meta/llama-3.2-90b-vision-instruct
            name: Llama 3.2 90B Vision
            input: [text, image]
          - id: mistralai/mistral-large
            name: Mistral Large (NVIDIA)
            input: [text]
          - id: nvidia/nv-embedqa-mistral-7b-v2
            name: Mistral 7B NV (ligero)
            input: [text]
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: high
