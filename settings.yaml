llm-pi-ai:
  providers:
    openai:
      displayName: OpenAI
      apiKeyEnv: OPENAI_API_KEY
      api: openai-completions
      baseURL: https://api.openai.com/v1
      defaultContextWindow: 128000
      defaultMaxTokens: 8192
      models:
        - id: gpt-5.6-luna
          name: GPT-5.6 Luna
          input: [text, image]
        - id: gpt-4-turbo
          name: GPT-4 Turbo
          input: [text, image]

    anthropic:
      displayName: Claude
      apiKeyEnv: ANTHROPIC_API_KEY
      api: anthropic-messages
      baseURL: https://api.anthropic.com
      defaultContextWindow: 200000
      defaultMaxTokens: 8192
      models:
        - id: claude-sonnet-5-5
          name: Claude Sonnet 5.5
          input: [text, image]
        - id: claude-haiku-4-5-20251001
          name: Claude Haiku 4.5
          input: [text, image]

    google:
      displayName: Gemini
      apiKeyEnv: GEMINI_API_KEY
      api: openai-completions
      baseURL: https://generativelanguage.googleapis.com/v1beta/openai
      defaultContextWindow: 128000
      defaultMaxTokens: 8192
      models:
        - id: gemini-3.8-flash
          name: Gemini 3.8 Flash
          input: [text, image]
        - id: gemini-3.5-flash-lite
          name: Gemini 3.5 Flash-Lite
          input: [text, image]
        - id: gemini-3.1-pro-preview
          name: Gemini 3.1 Pro (preview)
          input: [text, image]

    openrouter:
      displayName: OpenRouter
      apiKeyEnv: OPENROUTER_API_KEY
      api: openai-completions
      baseURL: https://openrouter.ai/api/v1
      defaultContextWindow: 128000
      defaultMaxTokens: 8192
      models:
        - id: nvidia/nemotron-3-ultra-550b-a55b:free
          name: Nemotron 3 Ultra (gratis)
        - id: nvidia/nemotron-3-super-120b-a12b:free
          name: Nemotron 3 Super (gratis)
        - id: thinkingmachines/inkling:free
          name: Inkling (gratis)
          input: [text, image]
        - id: qwen/qwen3.8-27b:free
          name: Qwen 3.8 27B (gratis)
          input: [text, image]
        - id: google/gemma-4-31b-it:free
          name: Gemma 4 31B (gratis)
          input: [text, image]
        - id: poolside/laguna-s-2.1:free
          name: Laguna S 2.1 (gratis, código)
        - id: cohere/north-mini-code:free
          name: North Mini Code (gratis)
        - id: openrouter/free
          name: OpenRouter Free (automático)
          input: [text, image]
        - id: deepseek/deepseek-v4.1-flash
          name: DeepSeek V4.1 Flash (de pago)
          input: [text, image]

    groq:
      displayName: Groq (Rápido & Gratis)
      apiKeyEnv: GROQ_API_KEY
      api: openai-completions
      baseURL: https://api.groq.com/openai/v1
      defaultContextWindow: 8000
      defaultMaxTokens: 2048
      models:
        - id: mixtral-8x7b-32768
          name: Mixtral 8x7B (Rápido)
          input: [text]
        - id: llama-3.1-70b-versatile
          name: Llama 3.1 70B
          input: [text]
        - id: llama-3.1-8b-instant
          name: Llama 3.1 8B (Ultra rápido)
          input: [text]
        - id: gemma2-9b-it
          name: Gemma 2 9B
          input: [text]

    ollama:
      displayName: Ollama (Local EC2)
      api: openai-completions
      baseURL: http://localhost:11434/v1
      defaultContextWindow: 4096
      defaultMaxTokens: 2048
      models:
        - id: mistral
          name: Mistral 7B
          input: [text]
        - id: llama2
          name: Llama 2 7B
          input: [text]
        - id: neural-chat
          name: Neural Chat 7B
          input: [text]
        - id: dolphin-mixtral
          name: Dolphin Mixtral
          input: [text]

    deepseek:
      displayName: DeepSeek
      apiKeyEnv: DEEPSEEK_API_KEY
      api: openai-completions
      baseURL: https://api.deepseek.com/v1
      defaultContextWindow: 64000
      defaultMaxTokens: 4096
      models:
        - id: deepseek-chat
          name: DeepSeek Chat
          input: [text]
        - id: deepseek-coder
          name: DeepSeek Coder
          input: [text]
